name: Python checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-video.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --check demo/app.js
      - run: node --test tests/browser/engine.test.mjs
      - run: python -m tests.http_smoke
      - run: python video_pipeline.py --demo --max-frames 60 --output results/demo.csv
